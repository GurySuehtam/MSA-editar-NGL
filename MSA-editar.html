
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MSA Anonymous - Gerador IA</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  body { margin:0; background:#0a0a0a; color:white; font-family: -apple-system, BlinkMacSystemFont, Arial; display:flex; flex-direction:column; align-items:center; padding:20px; }
  .box { background:#1a1a1a; padding:22px; border-radius:16px; width:100%; max-width:420px; border:1px solid #333; }
  textarea { width:100%; padding:14px; border-radius:12px; border:1px solid #333; background:#111; color:white; font-size:18px; font-weight:bold; box-sizing:border-box; resize:none; min-height:90px; }
  .btn { width:100%; padding:16px; background:linear-gradient(90deg,#ff7a00,#ff00aa); border:none; border-radius:12px; color:white; font-weight:bold; font-size:18px; cursor:pointer; margin-top:12px; }
  
  #loading { display:none; text-align:center; margin-top:30px; }
  .spinner { width:50px; height:50px; border:4px solid #222; border-top:4px solid #ff7a00; border-radius:50%; animation: spin 1s linear infinite; margin: 0 auto 15px; }
  @keyframes spin { 100% { transform: rotate(360deg); } }
  .barra { width:100%; max-width:320px; height:6px; background:#222; border-radius:10px; overflow:hidden; margin:15px auto 0; }
  .progresso { height:100%; width:0%; background:linear-gradient(90deg,#ff7a00,#ff00aa); animation: carrega 2.2s forwards; }
  @keyframes carrega { to { width:100%; } }

  #resultado { display:none; margin-top:20px; flex-direction:column; align-items:center; }
  /* AQUI ESTÁ SUA IMAGEM RECRIADA */
  #card { width: 1080px; height: 1920px; transform: scale(0.33); transform-origin: top center; margin-bottom: -1280px; background: linear-gradient(180deg, #ff6a2e 0%, #ff8a3d 20%, #ff7a6a 40%, #e85a8a 70%, #d93a8a 100%); display:flex; flex-direction:column; align-items:center; padding-top:180px; box-sizing:border-box; }
  .logo { font-size:110px; font-weight:900; letter-spacing:-3px; color:white; position:relative; }
  .logo::after { content:'✦'; font-size:40px; position:absolute; top:-10px; right:-35px; }
  .caixa-branca { background:white; width:820px; border-radius:70px; padding:60px 50px 90px; margin-top:160px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); display:flex; flex-direction:column; align-items:center; min-height:650px; }
  .pill { background: linear-gradient(90deg, #ffb3b3, #ffd6d6); padding:14px 34px; border-radius:40px; font-size:32px; font-weight:600; color:#111; letter-spacing:-0.5px; }
  #texto-meio { font-size:88px; font-weight:900; color:black; line-height:0.95; letter-spacing:-3px; text-align:left; width:100%; margin-top:80px; word-break:break-word; white-space:pre-wrap; }
  .rodape { font-size:30px; color:#333; margin-top:auto; padding-top:80px; }
</style>
</head>
<body>

<div class="box" id="formulario">
  <h2 style="margin:0">✨ MSA Anonymous IA</h2>
  <p style="color:#888; font-size:14px">Digite só a pergunta do meio, o resto é automático</p>
  <textarea id="msg" placeholder="Ex: c tem crush&#10;em mim? 🥺">c tem crush
em mim? 🥺</textarea>
  <button class="btn" onclick="gerar()">🪄 GERAR COM IA</button>
</div>

<div id="loading">
  <div class="spinner"></div>
  <h3>IA criando seu anonymous...</h3>
  <p style="color:#888">Aplicando gradiente MSA</p>
  <div class="barra"><div class="progresso"></div></div>
</div>

<div id="resultado">
  <div id="card">
    <div class="logo">MSA</div>
    <div class="caixa-branca">
      <div class="pill">MSA • anonymous</div>
      <div id="texto-meio"></div>
      <div class="rodape">responda nos stories</div>
    </div>
  </div>
  <div style="display:flex; gap:10px; width:100%; max-width:360px; margin-top:20px;">
    <button class="btn" style="background:white; color:black; flex:1" onclick="baixar()">📥 Salvar</button>
    <button class="btn" style="background:#222; border:1px solid #333; flex:1" onclick="location.reload()">Outro</button>
  </div>
</div>

<script>
function gerar() {
  const txt = document.getElementById('msg').value;
  if(!txt) { alert("Digite a mensagem!"); return; }
  document.getElementById('texto-meio').innerText = txt;
  
  document.getElementById('formulario').style.display='none';
  document.getElementById('loading').style.display='block';

  setTimeout(()=>{
    document.getElementById('loading').style.display='none';
    document.getElementById('resultado').style.display='flex';
  }, 2300);
}

async function baixar() {
  const card = document.getElementById('card');
  // volta ao tamanho original pra salvar em HD
  const originalScale = card.style.transform;
  card.style.transform = 'scale(1)';
  card.style.marginBottom = '0';
  
  const canvas = await html2canvas(card, { scale: 1, useCORS:true, backgroundColor:null });
  
  card.style.transform = originalScale;
  card.style.marginBottom = '-1280px';

  const link = document.createElement('a');
  link.download = `msa-${Date.now()}.png`;
  link.href = canvas.toDataURL();
  link.click();
}
</script>
</body>
</html>
